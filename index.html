<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Инфа под рукой 2.0</title>
    <style>
        /* === БАЗОВЫЕ СТИЛИ === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #1a1a1a;
            --accent-cyan: #00f0ff;
            --accent-cyan-glow: rgba(0, 240, 255, 0.3);
            --accent-cyan-dim: rgba(0, 240, 255, 0.1);
            --accent-green: #4ade80;
            --error-red: #f87171;
            --error-red-glow: rgba(255, 68, 68, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --border-color: #333333;
            
            --base-font-size-search: 1.3rem;
            --base-font-size-title: 16px;
            --base-font-size-detail: 13px;
            --base-font-size-label: 13px;
            --base-font-size-button: 13px;
            --base-font-size-context: 0.85rem;
            --base-font-size-no-results: 14px;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .screen {
            display: none;
            min-height: 100vh;
            width: 100%;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        /* === ЭКРАН ЗАГРУЗКИ === */
        #loading-screen {
            justify-content: center;
            align-items: center;
            background: var(--bg-primary);
            padding: 20px;
        }

        .loading-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 50px 30px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
        }

        .app-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px var(--accent-cyan-glow), 0 0 40px var(--accent-cyan-glow);
            animation: pulse-title 2s ease-in-out infinite;
            letter-spacing: -0.5px;
        }

        @keyframes pulse-title {
            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 20px var(--accent-cyan-glow), 0 0 40px var(--accent-cyan-glow);
            }
            50% {
                opacity: 0.85;
                text-shadow: 0 0 30px var(--accent-cyan-glow), 0 0 60px var(--accent-cyan), 0 0 80px var(--accent-cyan-glow);
            }
        }

        .app-version {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .spinner-container {
            margin: 30px 0;
        }

        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto;
            position: relative;
        }

        .spinner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            border: 3px solid var(--bg-secondary);
        }

        .spinner-progress {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--accent-cyan);
            border-right-color: var(--accent-cyan);
            animation: spin 1s linear infinite;
            box-shadow: 0 0 10px var(--accent-cyan-glow);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 15px;
            margin-top: 25px;
            letter-spacing: 0.5px;
        }

        /* === СТРАНИЦА ВХОДА === */
        #login-screen {
            justify-content: center;
            align-items: center;
            background: var(--bg-primary);
            padding: 20px;
            min-height: 100vh;
        }

        .login-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px 28px;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px var(--accent-cyan-glow);
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 400;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .login-input {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 18px;
            color: var(--text-primary);
            font-size: 18px;
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
            letter-spacing: 4px;
        }

        .login-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px var(--accent-cyan-glow), inset 0 0 10px var(--accent-cyan-dim);
        }

        .login-input::placeholder {
            color: var(--text-muted);
            letter-spacing: 1px;
            font-size: 15px;
        }

        .login-btn {
            background: transparent;
            border: 2px solid var(--accent-cyan);
            border-radius: 14px;
            padding: 16px 24px;
            color: var(--accent-cyan);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent-cyan-glow), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            box-shadow: 0 0 30px var(--accent-cyan-glow);
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        /* === ГЛАВНЫЙ ЭКРАН === */
        #main-screen {
            background: var(--bg-primary);
            padding: 20px 16px;
            min-height: 100vh;
        }

        .main-container {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        /* СТИКИ-БЛОК ДЛЯ ПОИСКА - ПРИЛИПАЕТ ПРИ ПРОКРУТКЕ */
        .sticky-search-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-primary);
            padding-top: 0;
            margin: 0 -16px;
            padding-left: 16px;
            padding-right: 16px;
        }

        .header-info {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-titles {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .greeting {
            font-size: 20px;
            font-weight: 500;
            margin: 0;
            color: var(--text-primary);
        }

        h2.greeting {
            font-size: 22px;
            margin-bottom: 4px;
            color: var(--accent-cyan);
            text-shadow: 0 0 15px var(--accent-cyan-glow);
            font-weight: 600;
        }

        h3.greeting {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .logout-btn {
            width: auto;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 8px 20px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-shrink: 0;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            border-color: var(--error-red);
            color: var(--error-red);
            box-shadow: 0 0 15px var(--error-red-glow);
            background: transparent;
        }

        .zoom-panel {
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .zoom-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 12px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            min-width: 40px;
        }

        .zoom-btn:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
            background: transparent;
        }

        .zoom-btn:active {
            transform: scale(0.95);
        }

        .zoom-indicator {
            color: var(--accent-green);
            font-size: 14px;
            font-weight: 600;
            padding: 4px 10px;
            background: rgba(74, 222, 128, 0.1);
            border-radius: 12px;
            min-width: 70px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .zoom-panel { gap: 8px; margin-bottom: 12px; padding-bottom: 10px; }
            .zoom-btn { padding: 5px 10px; font-size: 13px; min-width: 36px; }
            .zoom-indicator { font-size: 13px; padding: 3px 8px; min-width: 65px; }
            .sticky-search-wrapper {
                margin: 0 -12px;
                padding-left: 12px;
                padding-right: 12px;
            }
        }

        .search-section {
            margin-bottom: 16px;
        }

        .search-label {
            display: block;
            color: var(--text-secondary);
            font-size: var(--base-font-size-label);
            margin-bottom: 10px;
            padding-left: 4px;
            line-height: 1.4;
            transition: font-size 0.3s ease;
        }

        .search-input {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 18px;
            color: var(--text-primary);
            font-size: var(--base-font-size-search);
            outline: none;
            width: 100%;
            transition: all 0.3s ease;
        }

        .search-input:hover {
            border-width: 2px;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px var(--accent-cyan-glow);
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
            background: var(--bg-card);
            box-shadow: 0 0 25px var(--accent-cyan-glow), inset 0 0 10px var(--accent-cyan-dim);
            border-width: 2px;
        }

        .search-input::placeholder {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .error-btn, .add-data-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 10px 20px;
            color: var(--text-secondary);
            font-size: var(--base-font-size-button);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .error-btn:hover {
            border-color: var(--error-red);
            color: var(--error-red);
            box-shadow: 0 0 15px var(--error-red-glow);
        }

        .add-data-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 15px var(--accent-cyan-glow);
        }

        .add-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .add-options.hidden {
            display: none;
        }

        .add-option-btn {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            padding: 12px 20px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .add-option-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 15px var(--accent-cyan-glow);
            background: var(--bg-card);
        }

        .option-icon { font-size: 16px; }

        .results-container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            gap: 14px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            cursor: pointer;
        }

        .result-card:hover {
            border-color: var(--accent-cyan);
            transform: translateX(4px);
            box-shadow: 0 0 20px var(--accent-cyan-glow);
        }

        .result-icon { font-size: 28px; flex-shrink: 0; }
        .result-content { flex: 1; }
        .result-title { font-size: var(--base-font-size-title); font-weight: 600; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; transition: font-size 0.3s ease; }
        .result-detail { font-size: var(--base-font-size-detail); margin-bottom: 6px; line-height: 1.5; transition: font-size 0.3s ease; }
        .result-contact { font-size: var(--base-font-size-detail); color: var(--accent-cyan); display: flex; align-items: center; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-color); transition: font-size 0.3s ease; }
        .result-contact a { color: var(--accent-cyan); text-decoration: none; }
        .no-results { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: var(--base-font-size-no-results); background: var(--bg-card); border-radius: 16px; transition: font-size 0.3s ease; }
        .notification { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--bg-card); color: var(--text-primary); padding: 14px 24px; border-radius: 12px; font-size: 14px; z-index: 2000; border: 1px solid var(--border-color); opacity: 0; transition: all 0.3s ease; }
        .notification.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .notification.success { border-color: var(--accent-cyan); box-shadow: 0 0 20px var(--accent-cyan-glow); }
        .notification.error { border-color: var(--error-red); box-shadow: 0 0 20px var(--error-red-glow); }
        .hidden { display: none !important; }
        .contact-link { color: var(--accent-cyan); text-decoration: none; display: inline-block; margin: 4px 0; transition: opacity 0.2s; font-size: inherit; }
        .contact-link:hover { opacity: 0.8; text-decoration: underline; }
        .match-percent { display: inline-block; background: var(--accent-green); color: var(--bg-primary); font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 12px; margin-left: 8px; vertical-align: middle; transition: font-size 0.3s ease; }
        .result-context { font-size: var(--base-font-size-context); color: var(--text-secondary); margin-top: 4px; margin-bottom: 4px; padding: 4px 8px; background: rgba(0, 240, 255, 0.05); border-radius: 6px; transition: font-size 0.3s ease; }
        .parking-buttons { display: flex; gap: 12px; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border-color); justify-content: flex-start; }
        
        .parking-yes-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .parking-yes-btn:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.3);
            background: transparent;
        }
        .parking-yes-btn:active { transform: scale(0.95); }
        
        .parking-no-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .parking-no-btn:hover {
            border-color: var(--error-red);
            color: var(--error-red);
            box-shadow: 0 0 15px var(--error-red-glow);
            background: transparent;
        }
        .parking-no-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="loading-screen" class="screen active">
        <div class="loading-card">
            <h1 class="app-title">Инфа под рукой 2.0</h1>
            <p class="app-version">Web-приложение</p>
            <div class="spinner-container"><div class="spinner"><div class="spinner-progress"></div></div></div>
            <p class="loading-text">Проверка доступа</p>
        </div>
    </div>

    <div id="login-screen" class="screen">
        <div class="login-card">
            <div class="login-header"><h1 class="login-title">Инфа под рукой 2.0</h1><p class="login-subtitle">Web-приложение</p></div>
            <form id="login-form" class="login-form"><div class="input-group"><input type="password" id="login-password" class="login-input" placeholder="Введите код доступа" autocomplete="off" inputmode="numeric"></div><button type="submit" class="login-btn">ВОЙТИ</button></form>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <div class="main-container">
            <div class="header-info">
                <div class="header-titles">
                    <h2 class="greeting">Инфа под рукой 2.0</h2>
                    <h3 class="greeting"><span id="username">доступ ⭐️⭐️⭐️</span></h3>
                </div>
                <button id="logout-btn" class="logout-btn">🚪 Выход</button>
            </div>
            
            <div id="zoom-panel" class="zoom-panel">
                <button id="zoom-out-btn" class="zoom-btn" title="Уменьшить текст">🔍−</button>
                <span id="zoom-indicator" class="zoom-indicator">Масштаб</span>
                <button id="zoom-in-btn" class="zoom-btn" title="Увеличить текст">🔍+</button>
            </div>
            
            <!-- ПРИЛИПАЮЩИЙ БЛОК С ПОИСКОМ -->
            <div class="sticky-search-wrapper">
                <div class="search-section">
                    <label class="search-label">Напишите название: станции, документа или фамилию контакта</label>
                    <input type="text" id="search-input" class="search-input" placeholder="Введите текст запроса здесь" autocomplete="off">
                </div>
            </div>
            
            <a id="error-link" class="error-btn" href="https://forms.gle/ffQzDFhU2Lg9HncDA" target="_blank" rel="noopener noreferrer">
                <span class="error-icon">✍️</span>
                <span>Здесь можно написать об ошибке</span>
            </a>
            
            <button id="add-data-btn" class="add-data-btn">
                <span class="add-data-icon">📌</span>
                <span>Здесь можно добавить новые данные</span>
            </button>
            
            <div id="add-options" class="add-options hidden">
                <button class="add-option-btn" data-url="https://forms.gle/9mQKuBn1ggCTAnUeA"><span class="option-icon">🚇</span><span>О станции</span></button>
                <button class="add-option-btn" data-url="https://forms.gle/oG48epQE73tbvNAr9"><span class="option-icon">🅿️</span><span>О парковке</span></button>
                <button class="add-option-btn" data-url="https://forms.gle/Xjr82eoEH5qPZ89BA"><span class="option-icon">👤</span><span>О контакте</span></button>
            </div>
            
            <div id="results-container" class="results-container hidden"></div>
        </div>
    </div>
    <div id="notification" class="notification hidden"></div>

    <script>
        // --------------------------------------------------------------
        // 1. ХЕШ-ФУНКЦИЯ И КОДЫ ДОСТУПА
        function simpleHash(str) {
            if (!str) return '';
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return Math.abs(hash).toString(16);
        }
        
        const ACCESS_CODES = [
            { id: 1, codeHash: '1787c6', level: 3, name: 'Администратор', greeting: 'доступ ⭐️⭐️⭐️', permissions: ['contacts', 'stations', 'parking', 'documents'] },
            { id: 2, codeHash: '185df9', level: 2, name: 'Сотрудник', greeting: 'доступ ⭐️⭐️', permissions: ['contacts', 'stations', 'parking'] },
            { id: 3, codeHash: '18d2f2', level: 1, name: 'Стажер', greeting: 'доступ ⭐️', permissions: ['contacts', 'parking'] }

            calculateMatchPercent(text, query) {
                if (!text || !query) return 0;
                const t = text.toLowerCase(), q = query.toLowerCase();

                        const titleHtml = this.highlightText(item.название, currentQ, '#ffb347');
                        const buttons = `<div class="parking-buttons"><button class="parking-yes-btn" data-id="${item.id}">✅ Есть парковка</button><button class="parking-no-btn" data-id="${item.id}">❌ Нет парковки</button></div>`;
                        return `<div class="result-card parking" data-parking-id="${item.id}"><div class="result-icon">🅿️</div><div class="result-content"><div class="result-title">${titleHtml} ${item.matchPercent ? `<span class="match-percent">${Math.round(item.matchPercent)}%</span>` : ''}</div>${contextHtml}${noteHtml}${mapLink}${buttons}</div></div>`;
                    } else if(item.type === 'station') {
                        const fields = [];
                        if(item.линия) fields.push(`✳️ ${item.линия}`); if(item.станция) fields.push(`🟠 ${item.станция}`); if(item.кросс) fields.push(`🔹 КРОСС: ${item.кросс}`); if(item.радиоузел) fields.push(`🔹 РАДИОУЗЕЛ: ${item.радиоузел}`); if(item.бск) fields.push(`🔹 БСК: ${item.бск}`); if(item.код) fields.push(`🔹 КОД: ${item.код}`); if(item.дсп) fields.push(`🔻 ДСП: ${item.дсп}`); if(item.блокпост) fields.push(`🔻 БЛОК-ПОСТ: ${item.блокпост}`); if(item.туалет) fields.push(`🚾 с/у: ${item.туалет}`); if(item.инфа) fields.push(`💬 ИНФА: ${item.инфа}`); if(item.обновлено) fields.push(`✅ Обновлено: ${item.обновлено}`);
                        const phone = item.телефон ? `<div class="result-contact"><a href="tel:${item.телефон.replace(/[^0-9+]/g,'')}" class="contact-link">📞 ${this.escapeHtml(item.телефон)}</a></div>` : '';
                        const stationHtml = this.highlightText(item.станция || item.линия, currentQ, '#ffb347');
                        return `<div class="result-card station"><div class="result-icon">🚇</div><div class="result-content"><div class="result-title">${stationHtml} ${item.matchPercent ? `<span class="match-percent">${Math.round(item.matchPercent)}%</span>` : ''}</div>${fields.map(f=>`<div class="result-detail">${this.formatTextWithLinks(f)}</div>`).join('')}${phone}</div></div>`;
                    } else if(item.type === 'document') {
                        const fileLink = item.ссылка ? `<div class="result-contact"><a href="${item.ссылка}" target="_blank" class="contact-link" rel="noopener noreferrer">⭐️ ОТКРЫТЬ ФАЙЛ</a></div>` : '';
                        const titleHtml = this.highlightText(item.название, currentQ, '#ffb347');
                        return `<div class="result-card document"><div class="result-icon">📄</div><div class="result-content"><div class="result-title">${titleHtml} ${item.matchPercent ? `<span class="match-percent">${Math.round(item.matchPercent)}%</span>` : ''}</div>${fileLink}</div></div>`;
                    }
                    return '';
                }).join('');
                this.applyZoom(this.currentZoom);
                document.querySelectorAll('.parking-yes-btn, .parking-no-btn').forEach(btn => {
                    btn.removeEventListener('click', this.parkingHandler);
                    this.parkingHandler = (e) => { e.stopPropagation(); const id = parseInt(btn.getAttribute('data-id')); const status = btn.classList.contains('parking-yes-btn') ? 'yes' : 'no'; const today = new Date().toLocaleDateString('ru-RU'); const newNote = status === 'yes' ? `✅ проверено ${today}` : `❌ не актуально ${today}`; if(ParkingUI.updateParkingNote(id, newNote)) { this.showNotification(`Статус парковки обновлен: ${newNote}`, 'success'); this.performSearch(); } else this.showNotification('Ошибка обновления','error'); };
                    btn.addEventListener('click', this.parkingHandler);
                });
            }
            showNotification(msg, type='success') { if(!this.notification) return; this.notification.textContent = msg; this.notification.className = `notification ${type}`; setTimeout(()=>this.notification.classList.add('show'),10); setTimeout(()=>{ if(this.notification) this.notification.classList.remove('show'); },3000); }
            escapeHtml(t) { if(!t) return ''; const div = document.createElement('div'); div.textContent = t; return div.innerHTML; }
            init() {
                this.cacheElements(); this.bindEvents();
                const interval = setInterval(() => { if(ACCESS_CODES && CONTACTS_DATA && PARKING_DATA && STATIONS_DATA && DOCUMENTS_DATA) { clearInterval(interval); DATABASE.init(); ParkingUI.init(); this.startLoading(); } }, 50);
                setTimeout(() => { clearInterval(interval); if(!DATABASE.isInitialized) { if(this.loadingText) this.loadingText.textContent = 'Ошибка загрузки'; setTimeout(()=>this.showError('Не удалось загрузить данные'),1000); } }, 5000);
            }
            showError(msg) { const div = document.createElement('div'); div.style.cssText = 'position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#ff4444; color:white; padding:20px; border-radius:10px; z-index:10000;'; div.innerHTML = `<strong>❌ Ошибка</strong><br>${msg}`; document.body.appendChild(div); setTimeout(()=>div.remove(),5000); }
        }
        document.addEventListener('DOMContentLoaded', () => { window.app = new InfaApp(); });
    </script>
</body>
</html>
